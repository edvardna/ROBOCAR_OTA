<!DOCTYPE html>
<html>
<head>
  <title>ROBOCAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body { font-family: Arial; margin:16px }
    h2 { margin:0 0 10px 0 }
    .row { margin:8px 0 }
    .box {
      display:inline-block;
      padding:10px 14px;
      border:1px solid #aaa;
      border-radius:10px;
      margin:4px;
      min-width:120px;
      text-align:center
    }
    button {
      padding:12px 14px;
      margin:4px;
      min-width:140px
    }
    .grid {
      display:grid;
      grid-template-columns:repeat(3,140px);
      gap:8px;
      align-items:center;
      justify-content:start
    }
    .muted { color:#666 }
  </style>
</head>

<body>

<h2>ROBOCAR CONTROL</h2>

<div class="row box"><b>Motor:</b> <span id="en">-</span></div>
<div class="row box"><b>Move:</b> <span id="mv">-</span></div>
<div class="row box"><b>Mode:</b> <span id="mode">-</span></div>
<div class="row box"><b>Version:</b> <span id="ver">-</span></div>

<div class="row">
  <button onclick="toggleEnable()">Toggle Enable</button>
  <button onclick="toggleMaze()">Toggle Maze Mode</button>
</div>

<h3>D-PAD (manual)</h3>

<div class="grid">
  <div></div><button onclick="sendMove('FORWARD')">FORWARD</button><div></div>
  <button onclick="sendMove('LEFT')">LEFT</button>
  <button onclick="sendMove('STOP')">STOP</button>
  <button onclick="sendMove('RIGHT')">RIGHT</button>
  <div></div><button onclick="sendMove('BACKWARD')">BACKWARD</button><div></div>
</div>

<div class="row">
  <button onclick="sendMove('ROTATE_LEFT')">ROTATE LEFT</button>
  <button onclick="sendMove('ROTATE_RIGHT')">ROTATE RIGHT</button>
</div>

<p class="muted">When Maze Mode is ON, manual moves are ignored (enable still works).</p>

<h3>SENSORS</h3>

<div class="row box"><b>Right:</b> <span id="r">-</span></div>
<div class="row box"><b>Front:</b> <span id="f">-</span></div>
<div class="row box"><b>Left:</b> <span id="l">-</span></div>
<div class="row box"><b>Rear:</b> <span id="b">-</span></div>
<div class="row box" style="min-width:320px">
  <b>Last JSON:</b><br>
  <code id="j"></code>
</div>

<script>

// ===== MQTT CONNECT =====

const client = mqtt.connect(
  "wss://459c3601de32431485cd34dbf54a23d2.s1.eu.hivemq.cloud:8884/mqtt",
  {
    username: "robocar",
    password: "Robocar1!",
    reconnectPeriod: 2000
  }
);

let motorEnabled = false;
let currentMove = "STOP";
let mazeMode = false;

client.on("connect", () => {
  console.log("Connected to HiveMQ");
  client.subscribe("robocar/sensors");
  client.subscribe("robocar/status");
});

client.on("message", (topic, message) => {

  if (topic === "robocar/sensors") {
    const data = JSON.parse(message.toString());

    document.getElementById("r").textContent = data.right;
    document.getElementById("f").textContent = data.front;
    document.getElementById("l").textContent = data.left;
    document.getElementById("b").textContent = data.rear;
    document.getElementById("j").textContent = message.toString();
  }

  if (topic === "robocar/status") {
    const data = JSON.parse(message.toString());

    motorEnabled = (data.enabled === "ENABLED");
    currentMove = data.move;
    mazeMode = (data.mode === "MAZE");

    document.getElementById("en").textContent = data.enabled;
    document.getElementById("mv").textContent = data.move;
    document.getElementById("mode").textContent = data.mode;
    document.getElementById("ver").textContent = data.version;
  }
});

// ===== CONTROL FUNCTIONS =====

function sendMove(move) {

  if (!motorEnabled || mazeMode) return;

  const msg = { move: move };
  client.publish("robocar/control", JSON.stringify(msg));
}

function toggleEnable() {

  const msg = { enable: !motorEnabled };
  client.publish("robocar/control", JSON.stringify(msg));
}

function toggleMaze() {

  const msg = { maze: true }; 
  // Maze toggle handled via MQTT only if you support it
  // If not, we can add dedicated MQTT topic

  client.publish("robocar/control", JSON.stringify({ maze_toggle: true }));
}

</script>

</body>
</html>
